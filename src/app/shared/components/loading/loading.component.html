@switch (type) {
  @case ('spinner') {
    <div class="spinner-wrapper flex justify-center align-center w-100" style="padding: var(--space-8) 0;">
      <div class="loading-spinner"></div>
    </div>
  }
  @case ('skeleton') {
    <div class="skeleton-wrapper flex flex-column gap-md w-100">
      @for (i of countArray; track $index) {
        <div class="skeleton-item card flex flex-column gap-sm" style="padding: var(--space-5);">
          <div class="skeleton" style="height: 18px; width: 45%;"></div>
          <div class="skeleton" style="height: 14px; width: 25%;"></div>
          <div class="skeleton" style="height: 14px; width: 85%; margin-top: var(--space-1);"></div>
        </div>
      }
    </div>
  }
  @case ('bar') {
    <div class="bar-wrapper w-100" style="margin: var(--space-4) 0;">
      <div class="bar-progress"></div>
    </div>
  }
}
