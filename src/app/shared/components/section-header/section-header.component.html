<div class="section-header flex flex-column mb-md" style="border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-2);">
  <h2 class="section-title" style="margin: 0; font-size: var(--text-h2-size); font-weight: var(--text-h2-weight); line-height: var(--text-h2-lh); color: var(--color-text-primary);">{{ title }}</h2>
  @if (description) {
    <p class="section-description" style="margin: var(--space-1) 0 0 0; font-size: var(--text-caption-size); color: var(--color-text-secondary);">{{ description }}</p>
  }
</div>
