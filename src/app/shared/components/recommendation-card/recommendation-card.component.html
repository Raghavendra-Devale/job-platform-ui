<div *ngIf="isLoading" class="rec-card skeleton">
  <div class="skeleton-header">
    <div class="skeleton-title"></div>
    <div class="skeleton-score"></div>
  </div>
  <div class="skeleton-meta"></div>
  <div class="skeleton-reason-line"></div>
  <div class="skeleton-reason-line short"></div>
  <div class="skeleton-skills">
    <div class="skeleton-skill"></div>
    <div class="skeleton-skill"></div>
    <div class="skeleton-skill"></div>
  </div>
  <div class="skeleton-actions">
    <div class="skeleton-btn"></div>
    <div class="skeleton-btn"></div>
  </div>
</div>

<div *ngIf="!isLoading && recommendation" class="rec-card" (click)="onViewDetails($event)" style="cursor: pointer;">
  <div class="rec-header">
    <div class="rec-titles">
      <h3 class="rec-job-title" (click)="onViewDetails($event)">{{ recommendation.title }}</h3>
      <span class="badge" [ngClass]="getScoreClass(matchScore)">
        {{ matchScore }}% Match
      </span>
    </div>
  </div>
  <p class="rec-meta">{{ recommendation.company }} • {{ recommendation.location }}</p>
  <p class="rec-reason">{{ recommendation.recommendationReason }}</p>
  
  <div class="rec-skills" *ngIf="recommendation.matchingSkills?.length">
    <span *ngFor="let skill of recommendation.matchingSkills" class="badge badge-blue">
      {{ skill }}
    </span>
  </div>

  <div class="rec-actions" style="margin-top: var(--space-3); display: flex; gap: var(--space-2);">
    <button class="btn btn-sm btn-outline" (click)="onViewDetails($event)">View Details</button>
    <button *ngIf="recommendation.applyUrl" class="btn btn-sm btn-primary" (click)="onApply($event)">Apply Now</button>
    <button class="btn btn-sm btn-outline" (click)="onSave($event)">Save Job</button>
  </div>
</div>
