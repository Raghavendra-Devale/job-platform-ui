<div *ngIf="isLoading" class="rec-card skeleton" style="border: 1px solid var(--color-border); border-radius: 18px; padding: var(--space-5);">
  <div class="skeleton-header">
    <div class="skeleton-title"></div>
    <div class="skeleton-score"></div>
  </div>
  <div class="skeleton-meta"></div>
  <div class="skeleton-reason-line"></div>
  <div class="skeleton-reason-line short"></div>
  <div class="skeleton-skills">
    <div class="skeleton-skill"></div>
    <div class="skeleton-skill"></div>
    <div class="skeleton-skill"></div>
  </div>
  <div class="skeleton-actions">
    <div class="skeleton-btn"></div>
    <div class="skeleton-btn"></div>
  </div>
</div>

<div *ngIf="!isLoading && recommendation" class="rec-card" (click)="onViewDetails($event)" style="cursor: pointer; display: flex; flex-direction: column; gap: var(--space-4); border: 1px solid var(--color-border); border-radius: 18px; padding: var(--space-5); text-align: left; background: var(--color-surface); transition: transform 0.2s ease, box-shadow 0.2s ease; border-left: 4px solid;" [style.border-left-color]="getScoreClass(matchScore) === 'badge-green' ? 'var(--color-success)' : getScoreClass(matchScore) === 'badge-blue' ? 'var(--color-primary)' : getScoreClass(matchScore) === 'badge-amber' ? 'var(--color-warning)' : 'var(--color-error)'">
  <div class="rec-header-wrapper" style="display: flex; justify-content: space-between; align-items: start; width: 100%; gap: var(--space-4);">
    <div class="rec-titles" style="flex: 1; min-width: 0;">
      <div style="display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;">
        <h3 class="rec-job-title" style="margin: 0; font-size: var(--text-lg); font-weight: 700; color: var(--color-text-primary);" (click)="onViewDetails($event)">
          {{ recommendation.title }}
        </h3>
        <span *ngIf="recommendation.remote" class="badge badge-blue" style="background: var(--color-primary-light); color: var(--color-primary); font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: var(--radius-sm);">Remote</span>
      </div>
      <p class="rec-meta" style="margin: var(--space-1) 0 0 0; font-size: var(--text-xs); color: var(--color-text-secondary);">
        <strong>{{ recommendation.company }}</strong> &bull; {{ recommendation.location }}
      </p>
    </div>

    <!-- Match Score -->
    <div class="score-container" style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center;">
      <span class="badge" [ngClass]="getScoreClass(matchScore)" style="font-size: var(--text-xs); font-weight: 800; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);">
        {{ matchScore }}% Match
      </span>
    </div>
  </div>

  <!-- Recommendation Reason -->
  <div class="rec-reason-box" *ngIf="recommendation.recommendationReason" style="background-color: var(--color-surface-alt); border-radius: var(--radius-md); padding: var(--space-3); border: 1px solid var(--color-border-light);">
    <p style="margin: 0 0 var(--space-1) 0; font-size: 9px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Why this role?</p>
    <p style="margin: 0; font-size: var(--text-xs); color: var(--color-text-primary); line-height: 1.5;">
      {{ recommendation.recommendationReason }}
    </p>
  </div>

  <!-- Skills gap block -->
  <div class="rec-skills-grid" style="display: grid; gap: var(--space-3);">
    <!-- Matching Skills -->
    <div class="skills-block" *ngIf="recommendation.matchingSkills?.length">
      <span style="font-size: 10px; font-weight: 700; color: var(--color-success); text-transform: uppercase; letter-spacing: 0.05em;">Matching Skills</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;">
        <span *ngFor="let skill of recommendation.matchingSkills" class="badge" style="background: var(--color-success-light); color: var(--color-success); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-md);">
          {{ skill }}
        </span>
      </div>
    </div>

    <!-- Missing Skills -->
    <div class="skills-block" *ngIf="recommendation.missingSkills?.length">
      <span style="font-size: 10px; font-weight: 700; color: var(--color-error); text-transform: uppercase; letter-spacing: 0.05em;">Missing Skills</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;">
        <span *ngFor="let skill of recommendation.missingSkills" class="badge" style="background: var(--color-error-light); color: var(--color-error); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-md);">
          {{ skill }}
        </span>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="rec-actions" style="margin-top: var(--space-2); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--color-border-light); padding-top: var(--space-3);" (click)="$event.stopPropagation()">
    <div style="display: flex; gap: var(--space-2);">
      <button class="btn btn-ghost btn-sm flex align-center gap-xs" (click)="onSave($event)" style="display: flex; align-items: center; gap: 4px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        Save
      </button>
    </div>
    <div style="display: flex; gap: var(--space-2);">
      <button class="btn btn-outline btn-sm" (click)="onViewDetails($event)">View Details</button>
      <button *ngIf="recommendation.applyUrl" class="btn btn-sm btn-primary" (click)="onApply($event)">Apply Now</button>
    </div>
  </div>
</div>
