<header class="navbar">
  <div class="container navbar-inner">
    <!-- Logo -->
    <a routerLink="/jobs" class="logo" aria-label="JobBoard home">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
          <line x1="12" y1="12" x2="12" y2="16"/>
          <line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
      </div>
      <span class="logo-text">JobBoard</span>
    </a>

    <!-- Desktop Nav -->
    <nav class="nav-links" aria-label="Main navigation">
      <a routerLink="/jobs" routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}" class="nav-link" id="nav-jobs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Browse Jobs
      </a>

      <!-- Authenticated links -->
      <ng-container *ngIf="authService.isAuthenticated()">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link" id="nav-dashboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
          </svg>
          Dashboard
        </a>
        <a routerLink="/applications" routerLinkActive="active" class="nav-link" id="nav-applications">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Applications
        </a>
        <a routerLink="/saved-jobs" routerLinkActive="active" class="nav-link" id="nav-saved">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          Saved Jobs
        </a>
        <a routerLink="/recommendations" routerLinkActive="active" class="nav-link" id="nav-recommendations">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          Recommendations
        </a>
        <a routerLink="/resumes" routerLinkActive="active" class="nav-link" id="nav-resumes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          My Resumes
        </a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-link" id="nav-profile">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Profile
        </a>
        <button class="nav-link btn-link" (click)="logout()" id="nav-logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </ng-container>

      <!-- Guest links -->
      <ng-container *ngIf="!authService.isAuthenticated()">
        <a routerLink="/login" routerLinkActive="active" class="nav-link" id="nav-login">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Login
        </a>
        <a routerLink="/register" routerLinkActive="active" class="nav-link" id="nav-register">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          Register
        </a>
      </ng-container>

      <a routerLink="/admin" routerLinkActive="active" class="nav-link" id="nav-admin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Admin
      </a>
    </nav>

    <!-- Notification Bell (authenticated only) -->
    <app-notification-bell *ngIf="authService.isAuthenticated()"></app-notification-bell>

    <!-- Mobile hamburger -->
    <button
      class="hamburger"
      (click)="mobileOpen.set(!mobileOpen())"
      [attr.aria-expanded]="mobileOpen()"
      aria-controls="mobile-menu"
      aria-label="Toggle navigation"
      id="btn-hamburger">
      <span class="bar" [class.open]="mobileOpen()"></span>
      <span class="bar" [class.open]="mobileOpen()"></span>
      <span class="bar" [class.open]="mobileOpen()"></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <nav id="mobile-menu" class="mobile-menu" [class.open]="mobileOpen()" aria-label="Mobile navigation">
    <a routerLink="/jobs" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-jobs">Browse Jobs</a>
    
    <ng-container *ngIf="authService.isAuthenticated()">
      <a routerLink="/dashboard" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-dashboard">Dashboard</a>
      <a routerLink="/applications" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-applications">Applications</a>
      <a routerLink="/saved-jobs" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-saved">Saved Jobs</a>
      <a routerLink="/recommendations" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-recommendations">Recommendations</a>
      <a routerLink="/resumes" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-resumes">My Resumes</a>
      <a routerLink="/profile" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-profile">Profile</a>
      <a routerLink="/settings" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-settings">Settings</a>
      <button class="mobile-nav-link btn-link" (click)="logout(); mobileOpen.set(false)" id="mobile-nav-logout">Logout</button>
    </ng-container>

    <ng-container *ngIf="!authService.isAuthenticated()">
      <a routerLink="/login" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-login">Login</a>
      <a routerLink="/register" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-register">Register</a>
    </ng-container>

    <a routerLink="/admin" routerLinkActive="active" class="mobile-nav-link" (click)="mobileOpen.set(false)" id="mobile-nav-admin">Admin Dashboard</a>
  </nav>
</header>
