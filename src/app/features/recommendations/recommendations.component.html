<div class="container rec-page animate-fade-in-up">
  <!-- ── Page Header ── -->
  <app-page-header 
    title="Job Recommendations" 
    description="Personalized matches based on your resume & profile powered by AI." 
    icon="star"
  ></app-page-header>

  <!-- ── Loading State ── -->
  @if (state() === 'loading') {
    <div class="loading-container flex flex-column align-center justify-center p-lg" style="min-height: 400px;">
      <app-loading type="spinner" size="lg"></app-loading>
      <h3 style="font-size: var(--text-lg); font-weight: 700; color: var(--color-text-primary); margin-top: var(--space-4); margin-bottom: 2px;">
        Generating recommendations...
      </h3>
      <p style="font-size: var(--text-sm); color: var(--color-text-secondary); margin: 0;">
        {{ loadingProgress() }}
      </p>
    </div>
  }

  <!-- ── Initial State ── -->
  @if (state() === 'initial') {
    <div class="flex justify-center w-100" style="margin-top: var(--space-8);">
      <app-empty-state
        title="No Recommendations Yet"
        description="Click the button below to analyze your profile and find personalized job recommendations."
        icon="briefcase"
        actionText="Generate AI Recommendations"
        (actionClick)="startGeneration()"
        style="max-width: 600px; width: 100%;"
      ></app-empty-state>
    </div>
  }

  <!-- ── Error State ── -->
  @if (state() === 'error') {
    <div class="flex justify-center w-100" style="margin-top: var(--space-8);">
      <app-error-state
        message="Unable to generate recommendations."
        actionText="Retry"
        (actionClick)="startGeneration()"
        style="max-width: 600px; width: 100%;"
      ></app-error-state>
    </div>
  }

  <!-- ── Success (Cards Grid) ── -->
  @if (state() === 'success') {
    <div class="rec-grid flex flex-column gap-md mt-lg" style="display: flex; flex-direction: column; gap: var(--space-4); margin-top: var(--space-6);">
      @for (rec of recommendations(); track rec.jobId; let idx = $index) {
        <app-recommendation-card
          [recommendation]="rec"
          [style.animation-delay]="(idx * 60) + 'ms'"
          (save)="saveJob($event)"
          (apply)="applyJob($event)"
          (viewDetails)="viewJobDetails($event)">
        </app-recommendation-card>
      }
    </div>
  }
</div>
